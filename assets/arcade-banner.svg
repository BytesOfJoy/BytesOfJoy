<svg width="760" height="198" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title {
      font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
      font-size: 62px;
      font-weight: 900;
      fill: #C8A2FF;
      letter-spacing: 4px;
      text-anchor: middle;
    }
    .subtitle {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #BDA6E7;
      text-anchor: middle;
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0714"/>
      <stop offset="0.55" stop-color="#1A1230"/>
      <stop offset="1" stop-color="#120D24"/>
    </linearGradient>

    <radialGradient id="aura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(500 130) rotate(90) scale(110 420)">
      <stop stop-color="#7D4AC7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7D4AC7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2B2044" stroke-width="1.3"/>
    </pattern>

    <pattern id="scanlinePattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="260" rx="14" fill="url(#aura)"/>
  <rect width="1000" height="260" rx="14" fill="url(#gridPattern)"/>

  <text x="500" y="132" class="title" filter="url(#softGlow)" textLength="800" lengthAdjust="spacing">BYTESOFJOY</text>
  <text x="500" y="184" class="subtitle" textLength="760" lengthAdjust="spacing">Embedded Firmware Ranger • Gengar Mode</text>

  <rect width="1000" height="260" rx="14" fill="url(#scanlinePattern)" stroke="#4A3B68" stroke-width="2"/>
</svg>
